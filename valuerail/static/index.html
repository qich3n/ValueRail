<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueRail - Digital Ledger System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 ValueRail</h1>
            <p class="subtitle">Digital Value Settlement & Ledger System</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('accounts')">Accounts</button>
            <button class="tab-button" onclick="showTab('mint')">Mint</button>
            <button class="tab-button" onclick="showTab('transfer')">Transfer</button>
            <button class="tab-button" onclick="showTab('transactions')">Transactions</button>
        </div>

        <!-- Accounts Tab -->
        <div id="accounts-tab" class="tab-content active">
            <div class="card">
                <h2>Create New Account</h2>
                <form id="create-account-form" onsubmit="createAccount(event)">
                    <input type="text" id="account-name" placeholder="Account Name" required>
                    <button type="submit">Create Account</button>
                </form>
            </div>

            <div class="card">
                <h2>All Accounts</h2>
                <button onclick="loadAccounts()" class="refresh-btn">🔄 Refresh</button>
                <div id="accounts-list" class="accounts-grid"></div>
            </div>
        </div>

        <!-- Mint Tab -->
        <div id="mint-tab" class="tab-content">
            <div class="card">
                <h2>Mint Value to Account</h2>
                <form id="mint-form" onsubmit="mintValue(event)">
                    <select id="mint-account-id" required>
                        <option value="">Select Account...</option>
                    </select>
                    <input type="number" id="mint-amount" placeholder="Amount (in cents, e.g., 10000 = $100.00)" min="1" required>
                    <input type="text" id="mint-description" placeholder="Description" required>
                    <button type="submit">Mint Value</button>
                </form>
            </div>
        </div>

        <!-- Transfer Tab -->
        <div id="transfer-tab" class="tab-content">
            <div class="card">
                <h2>Transfer Value Between Accounts</h2>
                <form id="transfer-form" onsubmit="transferValue(event)">
                    <select id="from-account-id" required>
                        <option value="">From Account...</option>
                    </select>
                    <select id="to-account-id" required>
                        <option value="">To Account...</option>
                    </select>
                    <input type="number" id="transfer-amount" placeholder="Amount (in cents)" min="1" required>
                    <input type="text" id="transfer-description" placeholder="Description" required>
                    <button type="submit">Transfer</button>
                </form>
            </div>
        </div>

        <!-- Transactions Tab -->
        <div id="transactions-tab" class="tab-content">
            <div class="card">
                <h2>Transaction History</h2>
                <button onclick="loadTransactions()" class="refresh-btn">🔄 Refresh</button>
                <div id="transactions-list"></div>
            </div>
        </div>

        <!-- Notification Area -->
        <div id="notification" class="notification"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
